<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | DasherLab</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #0b2e59;
        }

        .reset-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .reset-card {
            width: 100%;
            max-width: 440px;
            background: #fff;
            border-radius: 20px;
            padding: 32px 28px;
            box-shadow: 0 12px 30px rgba(11, 46, 89, 0.12);
        }

        .logo {
            display: block;
            max-width: 220px;
            margin: 0 auto 24px;
        }

        h1 {
            margin: 0 0 10px;
            text-align: center;
            font-size: 2rem;
        }

        p {
            margin: 0 0 24px;
            text-align: center;
            color: #46536a;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 700;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px 14px;
            border: 2px solid #d7deec;
            border-radius: 10px;
            font-size: 1rem;
        }

        .submit-button {
            width: 100%;
            padding: 14px 16px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(180deg, #123d7a 0%, #0b2e59 100%);
            color: #fff;
            font-weight: 700;
            cursor: pointer;
        }

        .submit-button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .message {
            min-height: 24px;
            margin-top: 16px;
            text-align: center;
            font-weight: 600;
        }

        .message.error {
            color: #b42318;
        }

        .message.success {
            color: #146c43;
        }
    </style>
</head>
<body>
    <div class="reset-container">
        <div class="reset-card">
            <img src="assets/images/logo.PNG" class="logo" alt="DasherLab Logo">
            <h1>Reset Password</h1>
            <p>Choose a new password for your DasherLab client portal.</p>

            <form id="resetPasswordForm">
                <div class="form-group">
                    <label for="newPassword">New Password</label>
                    <input id="newPassword" name="newPassword" type="password" minlength="8" maxlength="72" required>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm New Password</label>
                    <input id="confirmPassword" name="confirmPassword" type="password" minlength="8" maxlength="72" required>
                </div>

                <button id="resetPasswordButton" type="submit" class="submit-button">Save New Password</button>
            </form>

            <div id="resetPasswordMessage" class="message" aria-live="polite"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="Avery/supabase.js"></script>
    <script>
      function setMessage(text, type) {
        var msg = document.getElementById('resetPasswordMessage');
        if (!msg) return;
        msg.textContent = text || '';
        msg.className = 'message' + (type ? ' ' + type : '');
      }

      async function handleResetPassword(event) {
        event.preventDefault();
        setMessage('', '');

        var form = document.getElementById('resetPasswordForm');
        var password = document.getElementById('newPassword').value;
        var confirmPassword = document.getElementById('confirmPassword').value;

        if (!password || !confirmPassword) {
          setMessage('Please enter and confirm a new password.', 'error');
          return;
        }

        if (password !== confirmPassword) {
          setMessage('Passwords do not match.', 'error');
          return;
        }

        if (!window.supabaseClient || !window.supabaseClient.auth || typeof window.supabaseClient.auth.updateUser !== 'function') {
          setMessage('Password reset is unavailable right now.', 'error');
          return;
        }

        var button = document.getElementById('resetPasswordButton');
        if (button) {
          button.disabled = true;
          button.textContent = 'Saving...';
        }

        try {
          var { data, error } = await window.supabaseClient.auth.updateUser({
            password: password
          });

          if (error) {
            setMessage(error.message || 'Unable to update your password.', 'error');
            return;
          }

          if (data && data.user) {
            setMessage('Your password was updated successfully. You can sign in with your new password.', 'success');
            form.reset();
            setTimeout(function () {
              window.location.replace('client-login.html');
            }, 2000);
          } else {
            setMessage('Your password was updated successfully. Please sign in again.', 'success');
          }
        } catch (error) {
          setMessage(error && error.message ? error.message : 'Unable to update your password.', 'error');
        } finally {
          if (button) {
            button.disabled = false;
            button.textContent = 'Save New Password';
          }
        }
      }

      document.getElementById('resetPasswordForm').addEventListener('submit', handleResetPassword);

      (async function handleRecoveryToken() {
        if (!window.supabaseClient || !window.supabaseClient.auth) {
          return;
        }

        try {
          var sessionResult = await window.supabaseClient.auth.getSession();
          var session = sessionResult && sessionResult.data ? sessionResult.data.session : null;
          if (!session) {
            setMessage('This password reset link is invalid or expired. Please request a new reset email.', 'error');
          }
        } catch (error) {
          setMessage('This password reset link is invalid or expired. Please request a new reset email.', 'error');
        }
      })();
    </script>
</body>
</html>
