<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DasherLab Login</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="assets/icons/app-icon.png">
    <style>
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-card {
            background: white;
            border-radius: 20px;
            padding: 50px;
            box-shadow: 0 8px 20px rgba(0,0,0,.15);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .login-card .logo {
            margin-bottom: 30px;
            max-width: 300px;
        }

        .login-card h1 {
            color: #0b2e59;
            font-size: 1.8rem;
            margin-bottom: 10px;
        }

        .login-card p {
            color: #666;
            margin-bottom: 30px;
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            color: #0b2e59;
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }

        .form-group input {
            width: 100%;
            padding: 14px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 1rem;
            transition: border-color .2s ease;
            box-sizing: border-box;
        }

        .form-group input:focus {
            outline: none;
            border-color: #0b2e59;
        }

        .login-button {
            width: 100%;
            padding: 14px;
            background: #0b2e59;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background .2s ease, transform .2s ease;
        }

        .login-button:hover {
            background: #0a2148;
            transform: translateY(-2px);
        }

        .login-button:active {
            transform: translateY(0);
        }

        .forgot-password-link {
            display: inline-block;
            margin-top: 14px;
            color: #0b2e59;
            font-size: 0.92rem;
            text-decoration: underline;
            cursor: pointer;
            border: none;
            background: transparent;
            padding: 0;
            font: inherit;
        }

        .login-error {
            min-height: 1.25rem;
            margin-top: 16px;
            color: #b42318;
            font-size: 0.95rem;
        }

        .login-info {
            min-height: 1.25rem;
            margin-top: 12px;
            color: #0b2e59;
            font-size: 0.9rem;
        }

        @media (max-width: 900px) {
            .app {
                max-width: 100%;
                padding: 20px;
            }
            
            .login-card {
                padding: 35px;
            }

            .login-card h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>

<body>

<div class="app">
    <div class="login-container">
        <div class="login-card">
            <img src="assets/images/logo.PNG" class="logo" alt="DasherLab Logo">
            
            <h1>Owner Login</h1>
            <p>Sign in to your DasherLab owner account</p>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <button type="submit" class="login-button">Sign In</button>
            </form>

            <button class="forgot-password-link" type="button" onclick="handleForgotPassword()">Forgot password?</button>
            <p id="loginError" class="login-error" role="alert" aria-live="polite"></p>
            <p id="loginInfo" class="login-info" aria-live="polite"></p>
            <p class="login-footer-link" style="margin-top: 18px; font-size: 0.92rem; color: #0b2e59;">
                Client login? <a href="client-login.html" style="color: #0b2e59; text-decoration: underline;">Go to client portal</a>
            </p>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="Avery/supabase.js"></script>
<script>
    function setLoginError(message) {
        const errorMessage = document.getElementById('loginError');
        if (errorMessage) {
            errorMessage.textContent = message || '';
        }
    }

    function setLoginInfo(message) {
        const infoMessage = document.getElementById('loginInfo');
        if (infoMessage) {
            infoMessage.textContent = message || '';
        }
    }

    function getPasswordResetRedirectUrl() {
        const configuredBase = window.DASHERLAB_SUPABASE_CONFIG && window.DASHERLAB_SUPABASE_CONFIG.appUrl
            ? window.DASHERLAB_SUPABASE_CONFIG.appUrl
            : null;

        const origin = configuredBase && String(configuredBase).trim()
            ? String(configuredBase).trim().replace(/\/$/, '')
            : (window.location && window.location.origin ? window.location.origin : 'https://dasherlab.org');

        return origin.replace(/\/$/, '') + '/reset-password.html';
    }

    async function handleForgotPassword() {
        setLoginError('');
        setLoginInfo('');

        const email = document.getElementById('email').value.trim();
        if (!email) {
            setLoginError('Enter your email first, then request a password reset.');
            return;
        }

        if (!window.supabaseClient || !window.supabaseClient.auth || typeof window.supabaseClient.auth.resetPasswordForEmail !== 'function') {
            setLoginError('Password reset is unavailable right now.');
            return;
        }

        try {
            const redirectUrl = getPasswordResetRedirectUrl();
            const result = await window.supabaseClient.auth.resetPasswordForEmail(email, {
                redirectTo: redirectUrl
            });

            if (result.error) {
                setLoginError(result.error.message || 'Unable to send reset instructions right now.');
                return;
            }

            setLoginInfo('Password reset instructions were sent if your email is registered.');
        } catch (error) {
            setLoginError('Unable to send reset instructions right now.');
        }
    }

    async function getOwnerSessionProfile(userId) {
        if (!window.supabaseClient || !userId) {
            return null;
        }

        const userResult = await window.supabaseClient
            .from('users')
            .select('id, role, business_id')
            .eq('id', userId)
            .maybeSingle();

        if (userResult.error || !userResult.data) {
            return null;
        }

        const role = String(userResult.data.role || '').toLowerCase();
        const businessId = userResult.data.business_id;

        if (role !== 'owner' || !businessId) {
            return null;
        }

        return {
            id: userResult.data.id,
            role,
            businessId
        };
    }

    async function handleLogin(event) {
        event.preventDefault();

        setLoginError('');
        setLoginInfo('');

        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        if (!window.supabaseClient) {
            setLoginError('Authentication is unavailable right now. Please try again.');
            return;
        }

        if (!email || !password) {
            setLoginError('Please enter your email and password.');
            return;
        }

        const submitButton = event.target && event.target.querySelector('.login-button');
        if (submitButton) {
            submitButton.disabled = true;
        }

        try {
            const result = await window.supabaseClient.auth.signInWithPassword({
                email: email,
                password: password
            });

            if (result.error) {
                setLoginError('Invalid email or password.');
                return;
            }

            const session = result.data && result.data.session ? result.data.session : null;
            const userId = session && session.user ? session.user.id : null;
            const ownerProfile = await getOwnerSessionProfile(userId);

            if (!ownerProfile) {
                if (window.supabaseClient && window.supabaseClient.auth && typeof window.supabaseClient.auth.signOut === 'function') {
                    await window.supabaseClient.auth.signOut();
                }
                setLoginError('This account is not authorized for the owner dashboard.');
                return;
            }

            window.location.replace('dashboard.html');
        } catch (error) {
            setLoginError('Unable to sign in right now. Please try again.');
        } finally {
            if (submitButton) {
                submitButton.disabled = false;
            }
        }
    }

    (async function redirectIfAuthenticated() {
        if (!window.supabaseClient) {
            return;
        }

        const sessionResult = await window.supabaseClient.auth.getSession();
        const session = sessionResult && sessionResult.data ? sessionResult.data.session : null;
        if (!session || !session.user || !session.user.id) {
            return;
        }

        const ownerProfile = await getOwnerSessionProfile(session.user.id);
        if (ownerProfile) {
            window.location.replace('dashboard.html');
        }
    })();
</script>

</body>
</html>
