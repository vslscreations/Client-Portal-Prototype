<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DasherLab Login</title>

    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="images/app-icon.png">
    <style>
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-card {
            background: white;
            border-radius: 20px;
            padding: 50px;
            box-shadow: 0 8px 20px rgba(0,0,0,.15);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .login-card .logo {
            margin-bottom: 30px;
            max-width: 300px;
        }

        .login-card h1 {
            color: #0b2e59;
            font-size: 1.8rem;
            margin-bottom: 10px;
        }

        .login-card p {
            color: #666;
            margin-bottom: 30px;
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            color: #0b2e59;
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }

        .form-group input {
            width: 100%;
            padding: 14px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 1rem;
            transition: border-color .2s ease;
            box-sizing: border-box;
        }

        .form-group input:focus {
            outline: none;
            border-color: #0b2e59;
        }

        .login-button {
            width: 100%;
            padding: 14px;
            background: #0b2e59;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background .2s ease, transform .2s ease;
        }

        .login-button:hover {
            background: #0a2148;
            transform: translateY(-2px);
        }

        .login-button:active {
            transform: translateY(0);
        }

        @media (max-width: 900px) {
            .app {
                max-width: 100%;
                padding: 20px;
            }
            
            .login-card {
                padding: 35px;
            }

            .login-card h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>

<body>

<div class="app">
    <div class="login-container">
        <div class="login-card">
            <img src="images/logo.png" class="logo" alt="DasherLab Logo">
            
            <h1>Welcome Back</h1>
            <p>Sign in to your account</p>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input 
                        type="text" 
                        id="username" 
                        name="username" 
                        placeholder="Enter your username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <button type="submit" class="login-button">Sign In</button>
            </form>
        </div>
    </div>
</div>

<script>
    function handleLogin(event) {
        event.preventDefault();
        
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        
        // Demo: accept any username and password
        if (username && password) {
            // Redirect to dashboard
            window.location.href = 'dashboard.html';
        }
    }
</script>

</body>
</html>
