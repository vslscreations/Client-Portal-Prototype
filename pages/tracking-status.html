<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tracking Status | DasherLab</title>
    <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
    <div class="app">
        <div class="page-header">
            <h1>Tracking Status</h1>
            <p>Review the latest request status and tracking details from this client portal.</p>
        </div>

        <div class="form-card">
            <div id="trackingStatusContent">
                <p>Loading tracking information...</p>
            </div>
            <button class="primary-button" type="button" onclick="window.location.href = '../index.html'">Return to Home</button>
        </div>
    </div>

    <script src="../js/navigation.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase-config.js"></script>
    <script src="../Avery/supabase.js"></script>
    <script src="../js/client-auth.js"></script>
    <script>
        (async function gateClientPortal() {
            if (!window.DasherLabClientAuth) {
                window.location.replace("../client-login.html");
                return;
            }

            if (typeof window.DasherLabClientAuth.guardProtectedClientRoute === "function") {
                const routeAllowed = await window.DasherLabClientAuth.guardProtectedClientRoute();
                if (!routeAllowed) {
                    return;
                }
            }
        })();
    </script>
    <script src="../Avery/memory.js"></script>
    <script src="../Avery/tracking.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const currentRequest = getLatestPickupRequest();
            const container = document.getElementById("trackingStatusContent");

            if (!container) {
                return;
            }

            if (!currentRequest) {
                container.innerHTML = "<div class='review-box'><p>No request has been saved yet.</p></div>";
                return;
            }

            container.innerHTML = `
                <div class="review-box">
                    <h3>${currentRequest.type === "Quote Request" ? "Quote Request" : "Pickup Request"}</h3>
                    <p><strong>Tracking Number:</strong><br>${currentRequest.trackingId || "Not available"}</p>
                    <p><strong>Status:</strong><br>${currentRequest.status || "Awaiting Dispatch"}</p>
                    <p><strong>Pickup Address:</strong><br>${currentRequest.delivery && currentRequest.delivery.pickupAddress ? currentRequest.delivery.pickupAddress : "Not provided"}</p>
                    <p><strong>Delivery Address:</strong><br>${currentRequest.delivery && currentRequest.delivery.deliveryAddress ? currentRequest.delivery.deliveryAddress : "Not provided"}</p>
                    <p><strong>Service:</strong><br>${currentRequest.delivery && currentRequest.delivery.serviceLevel ? currentRequest.delivery.serviceLevel : "Not provided"}</p>
                </div>
            `;
        });
    </script>
</body>
</html>
