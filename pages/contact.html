<div class="page-header">

<h1>
Connect With Our Team
</h1>

<p>
Avery will make sure your request reaches the right person.
</p>

</div>





<div class="form-card">


<h2>
Request Human Assistance
</h2>


<label>
Name
</label>

<input 
type="text"
id="contactName"
placeholder="Your name">



<label>
Phone Number
</label>

<input
type="tel"
id="contactPhone"
placeholder="Phone number">

<label>
Email
</label>

<input
type="email"
id="contactEmail"
placeholder="Email address">



<label>
What can we help with?
</label>

<textarea
id="contactMessage"
placeholder="Tell us how we can help">
</textarea>




<button 
class="primary-button"
onclick="submitContact()">

Send Request

</button>
